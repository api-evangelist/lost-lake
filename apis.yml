name: Lost Lake Games
description: >-
  Lost Lake Games is a Seattle-based independent video game studio building
  narrative-driven games. The studio raised a $5.1M seed round in 2022 led by
  BITKRAFT Ventures with participation from Lightspeed Venture Partners, 1Up
  Ventures, and Moon Holdings, and describes itself as being at the beginning of
  its next big adventure. As a consumer game developer, Lost Lake does not
  currently operate a public developer platform, API, SDK, or documentation
  surface; its web presence is a marketing site with an email signup and links to
  Steam, Discord, and Twitter/X. This profile captures the company's identity and
  public footprint within the API Evangelist network, surfaced originally as a
  Lightspeed Venture Partners portfolio company.
